<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">

<title>Bargains ending today</title>
<style>
:root{color-scheme:light;--bg:#fff;--fg:#111;--fg2:#555;--muted:#777;--faint:#999;--line:#e6e6e6;--photo:#f4f4f2;--chip:#f1f1ef;--accent:#2a78d6;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121212;--fg:#eee;--fg2:#bbb;--muted:#999;--faint:#777;--line:#2c2c2a;--photo:#1e1e1e;--chip:#222220;--accent:#3987e5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px 40px}
h1{font-size:20px;margin:20px 0 2px;letter-spacing:-.01em}
.lede{color:var(--muted);font-size:13px;margin:0 0 14px}
.controls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--fg2);padding:10px 0;border-top:1px solid var(--line)}
.controls label{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
select,input[type=search],button{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 7px}
input[type=search]{width:150px}
input[type=checkbox]{margin:0;accent-color:var(--accent)}
button{cursor:pointer;color:var(--fg2)}
.cats{border-bottom:1px solid var(--line);padding-bottom:12px}
.cats summary{cursor:pointer;font-size:13px;color:var(--fg2);padding:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--chip);color:var(--fg);border-radius:14px;padding:3px 10px;font-size:12px}
.chip:not(.on){background:none;border-color:var(--line);color:var(--faint);text-decoration:line-through}
.chip span{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums;display:inline-block}
.count{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 2px;color:var(--muted);font-size:13px}
.count b{color:var(--fg);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px 14px}
.sec{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--muted);padding:14px 0 6px;border-bottom:1px solid var(--line)}
.card{display:block;min-width:0}
.card.ended{opacity:.45}
.ph{aspect-ratio:1/1;background:var(--photo);display:flex;align-items:center;justify-content:center;padding:8px}
.ph img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.h{font-size:13px;font-weight:700;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.o{font-size:13px;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p{font-size:13px;margin-top:4px}.p span{color:var(--muted)}
.m{font-size:12px;color:var(--muted);margin-top:1px}
.l{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;color:var(--muted);padding:30px 0}
</style>
</head>

  <button id="reset">Reset to defaults</button>
</div>
<details class="cats" id="cats"><summary id="catsLabel">Categories</summary><div class="chips" id="chips"></div></details>
<div class="count"><span id="count"></span><span id="state"></span></div>
<div class="grid" id="grid"></div>
</div>

  if (l.maker) a.append(el("div", "h", l.maker), el("div", "o", l.object)); else a.append(el("div", "h", l.object));

  p.append(el("span", null, " · " + (l.est ? "est. " + (l.est_hi ? l.est.toLocaleString("sv-SE") + "–" + money(l.est_hi, l.cur) : money(l.est, l.cur)) : "no estimate")));

$("cats").open = matchMedia("(min-width: 700px)").matches;
syncControls();
update();
</script>
